<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="Start()">
    <h1>tic-tac-toe: remastered: remake</h1>
    <noscript>no JavaScript, no game... Please activate JavaScript in your browser.</noscript>
    <div>
        <h2> main menu</h2>
        <button onclick="CreateGame()">Create Game</button>
        <input class="gameCode" id="gameCode" type="password" placeholder="Enter Game Code or leave blank for random matchmaking..." maxlength=6>
        <button onclick="JoinGame()">Join Game</button>
    </div>
    <div>
        <h2>account</h2>
        <input class="username" id="username" type="text" placeholder="Enter your username..." minlength=3 maxlength=16>
        <button onclick="Save()">Save</button>
    </div>

</body>

<script src="network.js"></script>
<script src="script.js"></script>
</html>
