<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="Start()">
    <center>
    <h1>Tic-Tac-Toe</h1>
    <noscript>no JavaScript, no game... Please activate JavaScript in your browser.</noscript>
    <div>
        <h2>Welcome!</h2>
        <button class="glass" onclick="CreateGame()">Create Game</button>
        <input class="darkglass" id="gameCode" type="password" placeholder="Invite code..." maxlength=6>
        <button  class="glass"onclick="JoinGame()">Join Game</button>
    </div>
    <div>
        <h2>Details!</h2>
        <input class="darkglass" id="username" type="text" placeholder="Enter your username..." minlength=3 maxlength=16>
        <button onclick="Save()" class="glass">Save</button>
    </div>
    </center>
</body>

<script src="network.js"></script>
<script src="script.js"></script>
</html>
